    <script>
    try {
      // Deep pretty link restored by 404.html (or a server fallback): apply
      // it before the app boots so the first route is already correct.
      var _dl = sessionStorage.getItem('mgs-deep-link');
      if (_dl) {
        sessionStorage.removeItem('mgs-deep-link');
        history.replaceState(null, '', _dl);
      }
    } catch (e) {}
    try {
      var _p = JSON.parse(localStorage.getItem('mgs_settings') || '{}');
      var _m = (_p && _p.mode) || 'dark';
      document.documentElement.setAttribute('data-theme', (_m === 'light' || _m === 'dark' || _m === 'crimson-night' || _m === 'deep-ocean' || _m === 'forest-night' || _m === 'sunset-ember' || _m === 'royal-violet') ? _m : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="/styles.css?v=64" />
</head>

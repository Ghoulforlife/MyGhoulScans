<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyGhoulScans</title>
  <link rel="icon" href="assets/chibi.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    try {
      var _p = JSON.parse(localStorage.getItem('mgs_settings') || '{}');
      document.documentElement.setAttribute('data-theme', _p.mode === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <a id="logo" href="#/">
      <img id="logoImg" src="assets/chibi.png" alt="MyGhoulScans" />
      <span>MyGhoulScans</span>
    </a>
    <div id="searchbox">
      <input id="searchInput" type="search" placeholder="Search manhwa, manga, manhua..." />
    </div>
    <nav id="nav">
      <div class="nav-drop">
        <button id="genreDropBtn" class="nav-btn" title="Browse genres">Genres <span class="caret">&#9662;</span></button>
        <div id="genreMenu" class="genre-menu hidden"></div>
      </div>
      <a href="#/library">My Library</a>
      <a href="#/popular">Popular</a>
    </nav>
    <button id="settingsBtn" class="icon-btn" title="Settings">&#9881;</button>
    <span id="authArea"></span>
    <button id="menuBtn" class="icon-btn" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 18 14" width="18" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="1" y1="2" x2="17" y2="2"/><line x1="1" y1="7" x2="17" y2="7"/><line x1="1" y1="12" x2="17" y2="12"/></svg>
    </button>
  </header>

  <div id="mobileMenu" class="mob-menu hidden">
    <a href="#/">Home</a>
    <a href="#/library">My Library</a>
    <a href="#/popular">Popular</a>
    <button id="mmSettings">Settings</button>
  </div>
  </header>

  <main id="view"></main>

  <div id="modal" class="hidden">
    <div id="modalBox">
      <span id="modalClose">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
